<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Personal contact manager application">
    <title>Contact Manager</title>
    <script src="js/code.js"></script>
    <link href="css/contact.css" rel="stylesheet">
</head>
<body onload="readCookie();">
<main>
<h1>Yellow Pages</h1>
<button onclick="doLogout()">Logout</button>
<hr>
<h2>Add Contact</h2>
<input type="text" id="addFirstName" placeholder="First Name">
<br>
<input type="text" id="addLastName" placeholder="Last Name">
<br>
<input type="text" id="addEmail" placeholder="Email">
<br>
<input type="text" id="addPhone" placeholder="Phone Number">
<br>
<button onclick="addContact()">Add Contact</button>
<span id="contactAddResult"></span>
<hr>
<h2>Search Contacts</h2>
<input type="text" id="searchText" placeholder="Search">
<button onclick="searchContacts()">Search</button>
<span id="contactSearchResult"></span>
<hr>
<p></p>
<div id="editDiv" style="display:none;">
    <h2>Edit Contact</h2>
    <input type="text" id="editFirstName" placeholder="First Name">
    <br>
    <input type="text" id="editLastName" placeholder="Last Name">
    <br>
    <input type="text" id="editEmail" placeholder="Email">
    <br>
    <input type="text" id="editPhone" placeholder="Phone">
    <br>
    <button onclick="editContact(currentContactId)">Save</button>
    <span id="editResult"></span>
</div>

<div id="contactListDiv">
    <h2>Contact List</h2>
    <div id="contactListContainer">
        No contacts found.
    </div>
</div>
</main>
</body>
</html>
